name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install

      - name: Lint (JS/TS)
        run: npm run lint

      - name: Lint (Solidity)
        run: npm run lint:sol

      - name: Prettier check
        run: npm run format:check

      - name: Contract tests
        run: npm run test:contracts
